name: Update slideshow manifest

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: update-slideshow-manifest-main
  cancel-in-progress: false

jobs:
  update-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate slideshow manifest
        run: node scripts/generate-slideshow-manifest.js

      - name: Run tests
        run: node --test

      - name: Commit updated manifest
        shell: bash
        run: |
          if git diff --quiet -- js/slideshow-manifest.js; then
            echo "Slideshow manifest is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- js/slideshow-manifest.js
          git commit -m "chore: update slideshow manifest"
          git push origin HEAD:main
